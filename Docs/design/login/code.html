  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen relative antialiased selection:bg-secondary-container selection:text-on-secondary-container"><div class="fixed top-0 inset-x-0 z-50 pt-safe bg-surface/85 backdrop-blur-xl"><div class="h-10 px-5 flex items-center justify-between text-on-surface select-none"><span class="font-label-md text-label-md font-semibold tracking-tight">08:55</span><div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span><span class="material-symbols-outlined text-[16px]">wifi</span><span class="material-symbols-outlined text-[18px]">battery_full</span></div></div></div><main class="flex-1 flex flex-col relative w-full pt-10 pb-12 bg-surface"><div class="flex flex-col w-full px-margin py-space-sm space-y-space-lg select-none">
<!-- Brand & Emblem Header -->
<div class="flex flex-col items-center text-center pt-space-sm">
<div class="relative w-16 h-16 rounded-2xl bg-surface-container-high flex items-center justify-center shadow-sm">
<div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center relative overflow-hidden">
<div class="absolute -right-2 -bottom-2 w-7 h-7 rounded-full bg-secondary opacity-90"></div>
<span class="material-symbols-outlined text-on-primary text-[28px] relative z-10" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
</div>
<div class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container text-[11px]">verified</span>
</div>
</div>
<div class="mt-space-md space-y-space-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">Presensi Digital</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[260px] mx-auto">Sistem Pencatatan Kehadiran Karyawan</p>
</div>
</div>
<!-- Main Login Form Card -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-space-lg shadow-sm space-y-space-lg">
<div class="space-y-space-xs">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Masuk ke Akun Anda</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Gunakan email korporat terdaftar Anda</p>
</div>
<form class="space-y-space-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-space-xs">
<label class="block font-label-md text-label-md text-on-surface" for="email-input">Email</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-space-md h-[52px] focus-within:bg-surface-container-lowest focus-within:shadow-sm transition-all duration-200">
<span class="material-symbols-outlined text-outline text-[20px] mr-space-sm flex-shrink-0">mail</span>
<input autocomplete="email" class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="email-input" placeholder="nama@perusahaan.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-space-xs">
<label class="block font-label-md text-label-md text-on-surface" for="password-input">Kata Sandi</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-space-md h-[52px] focus-within:bg-surface-container-lowest focus-within:shadow-sm transition-all duration-200">
<span class="material-symbols-outlined text-outline text-[20px] mr-space-sm flex-shrink-0">lock</span>
<input autocomplete="current-password" class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none pr-2" id="password-input" placeholder="Masukkan kata sandi" required="" type="password"/>
<button aria-label="Toggle password visibility" class="w-10 h-10 -mr-2 rounded-lg flex items-center justify-center text-outline hover:text-on-surface focus:outline-none active:scale-95 transition-transform" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action CTA -->
<div class="pt-space-xs">
<button class="w-full h-[52px] bg-primary text-on-primary font-label-lg text-label-lg rounded-xl flex items-center justify-center space-x-space-xs shadow-md active:scale-[0.98] transition-all duration-150" id="btn-login" type="submit">
<span>Masuk</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Security Micro-badge -->
<div class="flex items-center justify-center space-x-1.5 pt-space-xs">
<span class="material-symbols-outlined text-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-label-sm text-label-sm text-secondary font-semibold uppercase tracking-wider">Enterprise End-to-End Secure</span>
</div>
</div>
<!-- Footer Navigation / Registration Link -->
<div class="flex justify-center items-center py-space-sm">
<p class="font-body-md text-body-md text-on-surface-variant">
      Belum punya akun? 
      <a class="font-label-lg text-label-lg text-secondary hover:text-primary font-bold ml-1 inline-flex items-center transition-colors" href="#">
        Daftar
      </a>
</p>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password-input');
    const toggleButton = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleButton && passwordInput && eyeIcon) {
      toggleButton.addEventListener('click', function(e) {
        e.preventDefault();
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main><div class="fixed bottom-0 inset-x-0 z-50 pointer-events-none pb-safe flex justify-center items-center h-10"><div class="w-32 h-1 rounded-full bg-on-surface/25"></div></div></body></html>
