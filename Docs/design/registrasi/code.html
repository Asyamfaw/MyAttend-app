  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen relative antialiased selection:bg-secondary-container selection:text-on-secondary-container"><div class="fixed top-0 inset-x-0 z-50 pt-safe bg-surface/85 backdrop-blur-xl"><div class="h-10 px-5 flex items-center justify-between text-on-surface select-none"><span class="font-label-md text-label-md font-semibold tracking-tight">08:55</span><div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span><span class="material-symbols-outlined text-[16px]">wifi</span><span class="material-symbols-outlined text-[18px]">battery_full</span></div></div></div><main class="flex-1 flex flex-col relative w-full pt-10 pb-12 bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Top App Bar Navigation -->
<div class="flex items-center gap-space-sm h-14 w-full">
<button aria-label="Kembali" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">Daftar</h1>
</div>
<!-- Header Welcome Text -->
<div class="mt-space-sm mb-space-lg">
<div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm mb-2">
<span class="material-symbols-outlined text-[14px] text-secondary">verified_user</span>
<span>Portal Kepegawaian Resmi</span>
</div>
<p class="font-headline-md text-headline-md text-on-surface">Buat Akun Presensi</p>
<p class="font-body-md text-body-md text-on-surface-variant mt-0.5">Buat akun presensi karyawan baru</p>
</div>
<!-- Registration Card Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm p-5 space-y-space-md">
<!-- Form Fields Form Container -->
<form class="space-y-space-md" id="register-form" onsubmit="event.preventDefault();">
<!-- 1. Email Field -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface" for="email-input">Email</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_2px_#001735] transition-all">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant absolute left-3.5 select-none pointer-events-none">mail</span>
<input autocomplete="email" class="w-full h-[52px] pl-11 pr-4 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="email-input" name="email" placeholder="contoh@email.com" required="" type="email"/>
</div>
</div>
<!-- 2. Kata Sandi Field -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface" for="password-input">Kata Sandi</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_2px_#001735] transition-all">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant absolute left-3.5 select-none pointer-events-none">lock</span>
<input autocomplete="new-password" class="w-full h-[52px] pl-11 pr-12 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="password-input" name="password" placeholder="Minimal 8 karakter" required="" type="password"/>
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-1 w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface active:bg-surface-container transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-eye-icon">visibility</span>
</button>
</div>
</div>
<!-- 3. Konfirmasi Kata Sandi Field -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface" for="confirm-password-input">Konfirmasi Kata Sandi</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_2px_#001735] transition-all">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant absolute left-3.5 select-none pointer-events-none">lock_reset</span>
<input autocomplete="new-password" class="w-full h-[52px] pl-11 pr-12 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="confirm-password-input" name="confirm-password" placeholder="Ulangi kata sandi" required="" type="password"/>
<button aria-label="Tampilkan atau sembunyikan konfirmasi kata sandi" class="absolute right-1 w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface active:bg-surface-container transition-colors" id="toggle-confirm-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="confirm-password-eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit CTA Button -->
<div class="pt-space-sm">
<button class="w-full h-[52px] rounded-xl bg-primary text-on-primary font-label-lg text-label-lg tracking-wide shadow-md active:opacity-90 active:scale-[0.99] transition-all flex items-center justify-center gap-2" id="btn-submit" type="submit">
<span>Daftar</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Bottom Helper Note & Login Link -->
<div class="mt-space-lg flex flex-col items-center justify-center text-center space-y-4">
<div class="inline-flex items-center gap-2 text-on-surface-variant">
<span class="font-body-md text-body-md">Sudah punya akun?</span>
<a class="font-label-lg text-label-lg text-secondary hover:underline transition-all" href="#login">Masuk</a>
</div>
<!-- Security Micro-Badge -->
<div class="flex items-center gap-1.5 text-outline">
<span class="material-symbols-outlined text-[15px]">encrypted</span>
<span class="font-body-sm text-body-sm text-on-surface-variant/80">Koneksi terenkripsi &amp; data tersimpan aman</span>
</div>
</div>
</div>
<script>
  (function() {
    // Password visibility toggle logic
    function setupPasswordToggle(toggleId, inputId, iconId) {
      const toggleBtn = document.getElementById(toggleId);
      const inputEl = document.getElementById(inputId);
      const iconEl = document.getElementById(iconId);

      if (!toggleBtn || !inputEl || !iconEl) return;

      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const isPassword = inputEl.type === 'password';
        inputEl.type = isPassword ? 'text' : 'password';
        iconEl.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    setupPasswordToggle('toggle-password', 'password-input', 'password-eye-icon');
    setupPasswordToggle('toggle-confirm-password', 'confirm-password-input', 'confirm-password-eye-icon');
  })();
</script></main><div class="fixed bottom-0 inset-x-0 z-50 pointer-events-none pb-safe flex justify-center items-center h-10"><div class="w-32 h-1 rounded-full bg-on-surface/25"></div></div></body></html>
